; Shuffle Alarm Clock - ESP32-S3 N16R8
; Uses the pioarduino platform (Arduino core 3.x), which the audio library needs.

[env:alarmclock]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 = 16 MB flash (quad) + 8 MB PSRAM (octal)
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; Two 6.5 MB app slots (for web firmware updates) + ~3.4 MB LittleFS
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0   ; clock messages go out the COM port
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    https://github.com/lovyan03/LovyanGFX.git#1.2.34
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.4.7
    https://github.com/ESP32Async/AsyncTCP.git#v3.5.0
    https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.12.1
    https://github.com/bblanchon/ArduinoJson.git#v7.4.3
